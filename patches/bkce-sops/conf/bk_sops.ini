[uwsgi]
socket = /data/app/run/uwsgi.sock
http = 0.0.0.0:8010
static-map = /o/bk_sops/static=/data/app/code/bk_sops/static
static-map2 = /static=/data/app/code/bk_sops/static
pidfile2 = /data/app/run/uwsgi.pid
logto2 = /data/app/logs/bk_sops/uwsgi.log

logdate = true
log-format = [%(addr)] [%(ctime)] [%(method)] [%(uri)] [%(proto)] [%(status)] [%(msecs)] [%(referer)] [%(uagent)]

memory-report = true

master = true
vacuum = true

chdir = /data/app/code/
module = wsgi:application

cheaper = 4
cheaper-initial = 4

workers = 16

cheaper-algo = busyness
cheaper-overload = 5
cheaper-step = 2
cheaper-busyness-multiplier = 60

buffer-size = 8192
post-buffering = 8192

max-requests = 1024
mount = /o/bk_sops=wsgi.py
manage-script-name = true
